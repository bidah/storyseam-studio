<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>Shot Studio — can't reach the studio</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #09090b; color: #fafafa;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card { max-width: 26rem; text-align: center; padding: 2rem; }
    h1 { font-size: 1.15rem; margin: 0 0 .5rem; }
    p { color: #a1a1aa; margin: 0 0 1.25rem; }
    button {
      background: #10b981; color: #052e22; border: 0; border-radius: .5rem;
      padding: .6rem 1.4rem; font: inherit; font-weight: 600; cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
    .dot { display: inline-block; width: .5rem; height: .5rem; border-radius: 999px;
      background: #f59e0b; margin-right: .45rem; vertical-align: middle; }
  </style>
</head>
<body>
  <div class="card">
    <h1><span class="dot"></span>Can't reach the studio backend</h1>
    <p id="detail">Shot Studio couldn't connect. Check your internet connection —
      the app will keep retrying, or you can retry now.</p>
    <button id="retry">Retry now</button>
  </div>
  <script>
    document.getElementById("retry").addEventListener("click", () => {
      window.desktop && window.desktop.retry();
    });
  </script>
</body>
</html>
