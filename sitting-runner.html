<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>Sitting runner</title>
    <style>
      html, body { margin: 0; background: #000; color: #9ca3af; font: 12px ui-monospace, monospace; }
      video { display: block; width: 100%; max-height: 90vh; background: #000; }
      #status { padding: 8px; }
    </style>
  </head>
  <body>
    <!--
      The Auto Sitting runner (issue #69, ADR 0001). Opened by headless Chrome in
      a Daytona box with its job token in the URL fragment; it plays one Sitting
      with the Stage's own session code, records it, and files it. Not a page a
      person visits: with no token it does nothing.
    -->
    <video id="picture" autoplay muted playsinline></video>
    <div id="status">waiting</div>
    <script type="module" src="/src/sitting-runner/main.ts"></script>
  </body>
</html>
