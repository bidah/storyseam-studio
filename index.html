<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StorySeam</title>
    <meta name="description" content="Write, storyboard, render and cut an episode in one place." />
    <!-- The header mark, as the tab icon. The SVG is the real one (crisp at any
         size, and what every current browser picks); the 32px PNG is the
         fallback for Safari below 17, which ignores an SVG favicon. The
         apple-touch-icon is full-bleed and unrounded because iOS applies its
         own mask to a home-screen icon. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#c5f332" />
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong
      // theme. Defaults to dark (matches the class on <html>).
      try {
        var t = localStorage.getItem("theme");
        document.documentElement.classList.toggle("dark", t !== "light");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
