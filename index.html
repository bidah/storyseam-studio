<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StorySeam</title>
    <meta name="description" content="Text to long form video stories in seconds." />
    <!-- Link previews. The card is drawn by the Worker (worker/src/routes/og.js);
         a shared /watch/:token page has these swapped for its Film's own there.
         Absolute URLs because a crawler resolves nothing. -->
    <meta property="og:site_name" content="StorySeam" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="StorySeam" />
    <meta property="og:description" content="Text to long form video stories in seconds." />
    <meta property="og:url" content="https://storyseam.app/" />
    <meta property="og:image" content="https://storyseam.app/og/default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="StorySeam" />
    <meta name="twitter:image" content="https://storyseam.app/og/default.png" />
    <!-- The header mark, as the tab icon. The SVG is the real one (crisp at any
         size, and what every current browser picks); the 32px PNG is the
         fallback for Safari below 17, which ignores an SVG favicon. The
         apple-touch-icon is full-bleed and unrounded because iOS applies its
         own mask to a home-screen icon. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#FFFFFF" />
    <!-- The faces `src/index.css` maps onto --font-sans / --font-mono /
         --font-display: Inter for body and JetBrains Mono for labels in both
         themes; headings in Inter Tight on the light (fal-like) theme and Teko
         on the dark (Battle Royale) one. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Inter:wght@400;500&family=Inter+Tight:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // LIGHT is the default (index.css `:root`); `theme: "dark"` in
      // localStorage opts into the dark palette (`.dark`). Applied before first
      // paint so a dark-mode reader never sees a white flash. The runtime side
      // of the same key is src/lib/theme.js (the headers' Sun/Moon button).
      try {
        if (localStorage.getItem("theme") === "dark") {
          document.documentElement.classList.add("dark");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0B0C0F");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
