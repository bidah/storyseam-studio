<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StorySeam</title>
    <meta name="description" content="Write, storyboard, render and cut an episode in one place." />
    <!-- The header mark, as the tab icon. The SVG is the real one (crisp at any
         size, and what every current browser picks); the 32px PNG is the
         fallback for Safari below 17, which ignores an SVG favicon. The
         apple-touch-icon is full-bleed and unrounded because iOS applies its
         own mask to a home-screen icon. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0f0f11" />
    <!-- The three faces `design.md` (Battle Royale) names: Teko for display and
         headings, Inter for body, JetBrains Mono for labels. They are the
         WHOLE app's ramp now, not just the public pages' — `src/index.css`
         maps them onto --font-sans / --font-mono / --font-display. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // The app is DARK, full stop — `class="dark"` above is the whole story and
      // this only cleans up after the old toggle. There used to be a light theme
      // behind a `theme` key in localStorage, and a browser that once flipped it
      // would keep landing on light forever; dropping the key means those
      // browsers come back to dark on the next load. The light palette still
      // exists in index.css (`:root`) but nothing selects it any more.
      try {
        localStorage.removeItem("theme");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
